name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  # The release PR bumps the root package.json. Two things must follow it on
  # the PR branch, or the release commit is inconsistent:
  #   - plugin/package.json and its lockfile carry the same version, so the
  #     installed plugin reports the release it came from;
  #   - package.json is part of the install unit embedded in
  #     plugin/server/generated/runtime-payload.ts, so the payload must be
  #     regenerated or the release commit fails check:plugin-payload.
  # ci on the bot-opened release PR waits for manual approval
  # (action_required), so the PR is easy to merge before that run reports;
  # fixing the branch here keeps it green. release-please rewrites the branch
  # on every update and reports the PR only when it created or updated it, so
  # this job re-adds the sync commit exactly when needed.
  release-payload:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install payload generator dependencies
        run: npm ci --include=dev

      - name: Match the plugin version to the release
        run: |
          version="$(node -p "require('./package.json').version")"
          npm --prefix plugin version "$version" --no-git-tag-version --allow-same-version

      - name: Regenerate plugin payload and commit
        run: |
          npm run generate:plugin-payload
          files="plugin/package.json plugin/package-lock.json plugin/server/generated/runtime-payload.ts"
          if git diff --quiet -- $files; then
            echo "plugin version and runtime payload already match the release PR"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $files
          git commit -m 'chore: sync plugin version and payload for release'
          git push origin HEAD
